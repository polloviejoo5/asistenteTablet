<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Panel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-1:#123a63;
    --bg-2:#2f6fa8;
    --panel:#111d30;
    --panel-line: rgba(255,255,255,0.08);
    --divider:#22324a;
    --text-hi:#eef2fa;
    --text-lo:#8a97ad;
    --clima:#f2b441;
    --calendario:#7c9eff;
    --mic:#4fd8c4;
    --mic-glow: rgba(79,216,196,0.55);
    --danger:#e5697b;
  }

  *{box-sizing:border-box;}
  html,body{
    margin:0; padding:0; width:100%; height:100%;
    background: radial-gradient(120% 140% at 50% -10%, var(--bg-2), var(--bg-1));
    transition: background 1.4s ease;
    color:var(--text-hi);
    font-family:'Inter',sans-serif;
    overflow:hidden;
    -webkit-user-select:none; user-select:none;
  }

  #app{ display:flex; flex-direction:column; width:100vw; height:100vh; }

  #topbar{
    display:flex; justify-content:space-between; align-items:baseline;
    padding: 18px 34px 6px 34px;
    color:var(--text-lo);
    font-family:'Space Grotesk',sans-serif;
    font-size:15px; letter-spacing:.04em; text-transform:uppercase;
  }
  #topbar #clock{ color:var(--text-hi); font-size:20px; }

  #panels{ flex:1; display:flex; position:relative; padding: 6px 34px 0 34px; gap:0; }
  .panel{ flex:1; display:flex; flex-direction:column; padding: 18px 30px 40px 30px; min-width:0; }
  #panels::after{
    content:''; position:absolute; left:50%; top:14px; bottom:70px;
    width:1px; background:var(--divider); transform:translateX(-0.5px);
  }

  .panel-label{
    font-family:'Space Grotesk',sans-serif;
    font-size:14px; letter-spacing:.12em; text-transform:uppercase;
    margin:0 0 14px 0;
  }
  #clima-col .panel-label{ color:var(--clima); }
  #cal-col .panel-label{ color:var(--calendario); }

  /* --- clima --- */
  #clima-hoy{ display:flex; align-items:center; gap:14px; margin-bottom:14px; }
  #clima-icono{ width:76px; height:76px; flex-shrink:0; display:flex; align-items:center; justify-content:center; }
  #clima-temp{ font-family:'Space Grotesk',sans-serif; font-size:56px; font-weight:700; }
  #clima-desc{ color:var(--text-lo); font-size:16px; margin-top:2px; }
  #clima-detalle{ display:flex; gap:22px; color:var(--text-lo); font-size:14px; margin-bottom:16px; }
  #clima-minmax{ font-size:15px; color:var(--text-hi); margin-bottom:20px; }
  #clima-minmax b{ color:var(--clima); font-weight:600; }
  #clima-error{ color:var(--danger); font-size:14px; display:none; }

  /* pronóstico */
  #pronostico{ display:flex; gap:6px; margin-top:auto; padding-top:12px; border-top:1px solid var(--panel-line); }
  .dia-forecast{ flex:1; display:flex; flex-direction:column; align-items:center; gap:4px; }
  .df-nombre{ font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--text-lo); }
  .df-icono{ width:32px; height:32px; }
  .df-max{ font-size:14px; font-weight:600; }
  .df-min{ font-size:12px; color:var(--text-lo); }

  /* --- calendario --- */
  #eventos{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:14px; overflow:hidden; }
  .evento{ display:flex; gap:14px; }
  .evento .cuando{ font-family:'Space Grotesk',sans-serif; font-size:14px; color:var(--calendario); min-width:78px; padding-top:1px; }
  .evento .titulo{ font-size:16px; color:var(--text-hi); line-height:1.3; }
  .evento .titulo .lugar{ display:block; font-size:13px; color:var(--text-lo); margin-top:2px; }
  #cal-vacio, #cal-error{ color:var(--text-lo); font-size:14px; display:none; }
  #cal-error{ color:var(--danger); }

  /* --- botón de voz --- */
  #mic-wrap{ position:absolute; left:50%; bottom:14px; transform:translate(-50%,50%); display:flex; flex-direction:column; align-items:center; z-index:5; }
  #mic-btn{
    width:84px; height:84px; border-radius:50%; border:none; cursor:pointer;
    background: radial-gradient(circle at 35% 30%, #7ff0de, var(--mic) 60%);
    box-shadow: 0 0 0 8px rgba(255,255,255,0.03), 0 8px 30px var(--mic-glow);
    display:flex; align-items:center; justify-content:center;
    transition: transform .15s ease, box-shadow .3s ease;
  }
  #mic-btn:active{ transform:scale(0.94); }
  #mic-btn svg.mic-glyph{ width:34px; height:34px; fill:#062522; }
  #mic-hint{ margin-top:10px; font-size:12px; color:var(--text-lo); letter-spacing:.05em; text-transform:uppercase; }
  #mic-btn.listening{ animation: pulse 1.1s ease-in-out infinite; }
  #mic-btn.thinking{ animation: spin 1.4s linear infinite; }
  @keyframes pulse{ 0%,100%{ box-shadow:0 0 0 8px rgba(79,216,196,.12), 0 0 20px var(--mic-glow);} 50%{ box-shadow:0 0 0 18px rgba(79,216,196,.05), 0 0 45px var(--mic-glow);} }
  @keyframes spin{ from{ filter:hue-rotate(0deg);} to{ filter:hue-rotate(40deg);} }

  #answer{
    position:absolute; left:50%; bottom:120px; transform:translateX(-50%);
    width:min(640px, 84vw); max-height:46vh; overflow:auto;
    background:var(--panel); border:1px solid var(--panel-line); border-radius:20px; padding:22px 26px;
    box-shadow:0 20px 60px rgba(0,0,0,.5); display:none; z-index:6;
  }
  #answer.show{ display:block; }
  #answer .q{ color:var(--text-lo); font-size:13px; text-transform:uppercase; letter-spacing:.08em; margin-bottom:8px;}
  #answer .a{ font-size:19px; line-height:1.5; display:flex; gap:14px; align-items:flex-start; }
  #answer .a .icono{ font-size:30px; flex-shrink:0; }
  #answer .close{ position:absolute; top:10px; right:14px; color:var(--text-lo); font-size:20px; cursor:pointer; }

  /* ---- íconos de clima SVG animados ---- */
  .w-icon{ width:76px; height:76px; overflow:visible; }
  .w-icon.mini{ width:32px; height:32px; }
  .w-icon.mini *{ animation:none !important; }

  .sun-core{ fill:var(--clima); }
  .sun-rays line{ stroke:var(--clima); stroke-width:4; stroke-linecap:round; }
  .sun-rays{ transform-origin:50px 50px; animation: girar 22s linear infinite; }

  .moon path{ fill:#cfd8f2; }

  .cloud ellipse, .cloud rect{ fill:#c9d3e4; }
  .cloud.cloud-front{ transform-origin:50px 50px; animation: flotar 6s ease-in-out infinite alternate; }
  .cloud:not(.cloud-front){ transform-origin:50px 50px; animation: flotar 7s ease-in-out infinite alternate; }

  .drop{ stroke:#7ea9e0; stroke-width:4; stroke-linecap:round; opacity:0; animation: caer 1.1s linear infinite; }
  .drop0{ animation-delay:0s; } .drop1{ animation-delay:.25s; } .drop2{ animation-delay:.5s; } .drop3{ animation-delay:.75s; }

  .flake{ fill:#e8edf7; opacity:0; animation: nevar 2.6s ease-in infinite; }
  .flake0{ animation-delay:0s; } .flake1{ animation-delay:.6s; } .flake2{ animation-delay:1.2s; } .flake3{ animation-delay:1.8s; }

  .bolt{ fill:#f2d94f; animation: relampago 1.8s steps(1) infinite; }

  .fog{ stroke:#93a2ba; stroke-width:4; stroke-linecap:round; opacity:.55; animation: niebla 4s ease-in-out infinite; }
  .f2{ animation-delay:.4s; } .f3{ animation-delay:.8s; }

  @keyframes girar{ to{ transform:rotate(360deg); } }
  @keyframes flotar{ from{ transform:translateX(-3px);} to{ transform:translateX(3px);} }
  @keyframes caer{ 0%{ transform:translateY(0); opacity:0;} 20%{opacity:1;} 100%{ transform:translateY(14px); opacity:0;} }
  @keyframes nevar{ 0%{ transform:translateY(0) translateX(0); opacity:0;} 20%{opacity:1;} 100%{ transform:translateY(16px) translateX(4px); opacity:0;} }
  @keyframes relampago{ 0%,88%,100%{ opacity:0;} 90%,96%{ opacity:1;} }
  @keyframes niebla{ 0%,100%{ transform:translateX(0); opacity:.4;} 50%{ transform:translateX(6px); opacity:.7;} }

  .oculto{ display:none !important; }
</style>
</head>
<body>
<div id="app">

  <div id="topbar">
    <span id="fecha"></span>
    <span id="clock"></span>
  </div>

  <div id="panels">
    <div class="panel" id="clima-col">
      <p class="panel-label">Clima</p>
      <div id="clima-hoy">
        <div id="clima-icono"></div>
        <div>
          <div id="clima-temp">--°</div>
          <div id="clima-desc">Cargando…</div>
        </div>
      </div>
      <div id="clima-detalle">
        <span id="clima-hum">Humedad --%</span>
        <span id="clima-viento">Viento -- km/h</span>
      </div>
      <div id="clima-minmax"></div>
      <div id="clima-error">No se pudo cargar el clima.</div>
      <div id="pronostico"></div>
    </div>

    <div class="panel" id="cal-col">
      <p class="panel-label">Calendario</p>
      <ul id="eventos"></ul>
      <div id="cal-vacio">No hay eventos próximos.</div>
      <div id="cal-error">No se pudo cargar el calendario. Revisá CALENDAR_API_KEY / CALENDAR_ID.</div>
    </div>
  </div>

  <div id="answer">
    <span class="close" onclick="cerrarRespuesta()">✕</span>
    <div class="q" id="answer-q"></div>
    <div class="a"><span class="icono" id="answer-icon">✨</span><span id="answer-text"></span></div>
  </div>

  <div id="mic-wrap">
    <button id="mic-btn" onclick="activarConsulta()">
      <svg class="mic-glyph" viewBox="0 0 24 24"><path d="M12 14a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v5a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2z"/></svg>
    </button>
    <div id="mic-hint">Tocá para preguntar</div>
  </div>

</div>

<script>
const CONFIG = {
  LAT: -34.6037,
  LON: -58.3816,
  CIUDAD: "Buenos Aires",
  VOZ_LANG: "es-AR",
  REFRESCO_MS: 15 * 60 * 1000
  // Ya no hay claves acá: GEMINI_API_KEY, CALENDAR_API_KEY y CALENDAR_ID
  // ahora viven como variables de entorno en Vercel (ver README).
};

/* ============== RELOJ ============== */
function actualizarReloj(){
  const ahora = new Date();
  document.getElementById('clock').textContent = ahora.toLocaleTimeString('es-AR', {hour:'2-digit', minute:'2-digit'});
  document.getElementById('fecha').textContent = ahora.toLocaleDateString('es-AR', {weekday:'long', day:'numeric', month:'long'});
}
setInterval(actualizarReloj, 15000);
actualizarReloj();

/* ============== ÍCONOS SVG DE CLIMA ============== */
const ICON = {
  sun: () => `<g class="sun">
      <g class="sun-rays">
        <line x1="50" y1="8" x2="50" y2="18"/><line x1="50" y1="82" x2="50" y2="92"/>
        <line x1="8" y1="50" x2="18" y2="50"/><line x1="82" y1="50" x2="92" y2="50"/>
        <line x1="21" y1="21" x2="28" y2="28"/><line x1="72" y1="72" x2="79" y2="79"/>
        <line x1="21" y1="79" x2="28" y2="72"/><line x1="72" y1="28" x2="79" y2="21"/>
      </g>
      <circle cx="50" cy="50" r="20" class="sun-core"/>
    </g>`,
  moon: () => `<g class="moon"><path d="M64 18a34 34 0 1 0 16 62 28 28 0 0 1-16-62z"/></g>`,
  cloud: (cls='') => `<g class="cloud ${cls}">
      <ellipse cx="38" cy="62" rx="20" ry="15"/><ellipse cx="58" cy="56" rx="25" ry="19"/>
      <ellipse cx="76" cy="64" rx="15" ry="11"/><rect x="28" y="62" width="58" height="15" rx="7.5"/>
    </g>`,
  rainDrops: () => [0,1,2,3].map(i => `<line x1="${34+i*12}" y1="82" x2="${30+i*12}" y2="94" class="drop drop${i}"/>`).join(''),
  snowDots: () => [0,1,2,3].map(i => `<circle cx="${34+i*12}" cy="88" r="2.2" class="flake flake${i}"/>`).join(''),
  bolt: () => `<path d="M56 78 L44 96 L52 96 L46 112 L64 90 L55 90 Z" class="bolt"/>`,
  fogLines: () => `<line x1="14" y1="55" x2="86" y2="55" class="fog f1"/><line x1="20" y1="68" x2="92" y2="68" class="fog f2"/><line x1="10" y1="81" x2="82" y2="81" class="fog f3"/>`
};

function iconoSVG(code, isDay, extraClass=''){
  const cielo = isDay ? ICON.sun() : ICON.moon();
  let inner;
  if(code === 0) inner = cielo;
  else if(code === 1 || code === 2) inner = cielo + ICON.cloud('cloud-front');
  else if(code === 3) inner = ICON.cloud();
  else if(code === 45 || code === 48) inner = ICON.cloud() + ICON.fogLines();
  else if([51,53,55,61,63,65,80,81].includes(code)) inner = ICON.cloud() + ICON.rainDrops();
  else if([71,73,75].includes(code)) inner = ICON.cloud() + ICON.snowDots();
  else if([82,95,96,99].includes(code)) inner = ICON.cloud() + ICON.bolt();
  else inner = cielo;
  return `<svg viewBox="0 0 100 100" class="w-icon ${extraClass}">${inner}</svg>`;
}

// emoji simple, solo como ícono de acompañamiento en la tarjeta de respuesta por voz
const WMO_EMOJI = {0:'☀️',1:'🌤️',2:'⛅',3:'☁️',45:'🌫️',48:'🌫️',51:'🌦️',53:'🌦️',55:'🌦️',61:'🌧️',63:'🌧️',65:'🌧️',71:'🌨️',73:'🌨️',75:'🌨️',80:'🌦️',81:'🌧️',82:'⛈️',95:'⛈️',96:'⛈️',99:'⛈️'};
let ultimoCodigoClima = 0;

/* ============== FONDO DINÁMICO SEGÚN CLIMA/HORA ============== */
const TEMAS = {
  despejado_dia: ['#123a63','#2f6fa8'],
  despejado_noche: ['#050912','#0d1830'],
  nublado_dia: ['#1b2534','#2b394e'],
  nublado_noche: ['#0a0e16','#141b28'],
  lluvia: ['#0c1622','#1a2c40'],
  nieve: ['#111a2b','#232f45'],
  tormenta: ['#120a1e','#231435'],
  niebla: ['#151b24','#242b36']
};
function temaParaClima(code, isDay){
  if(code===0) return isDay ? TEMAS.despejado_dia : TEMAS.despejado_noche;
  if(code===1||code===2||code===3) return isDay ? TEMAS.nublado_dia : TEMAS.nublado_noche;
  if(code===45||code===48) return TEMAS.niebla;
  if([51,53,55,61,63,65,80,81].includes(code)) return TEMAS.lluvia;
  if([71,73,75].includes(code)) return TEMAS.nieve;
  if([82,95,96,99].includes(code)) return TEMAS.tormenta;
  return isDay ? TEMAS.despejado_dia : TEMAS.despejado_noche;
}
function aplicarTema(code, isDay){
  const [c1,c2] = temaParaClima(code, isDay);
  document.documentElement.style.setProperty('--bg-1', c1);
  document.documentElement.style.setProperty('--bg-2', c2);
}

/* ============== CLIMA (Open-Meteo) ============== */
async function cargarClima(){
  const err = document.getElementById('clima-error');
  err.style.display = 'none';
  try{
    const url = `https://api.open-meteo.com/v1/forecast?latitude=${CONFIG.LAT}&longitude=${CONFIG.LON}` +
      `&current=temperature_2m,relative_humidity_2m,weather_code,wind_speed_10m,is_day` +
      `&daily=temperature_2m_max,temperature_2m_min,weather_code&timezone=auto`;
    const r = await fetch(url);
    if(!r.ok) throw new Error('http ' + r.status);
    const d = await r.json();

    const code = d.current.weather_code;
    const isDay = d.current.is_day === 1;
    ultimoCodigoClima = code;

    document.getElementById('clima-icono').innerHTML = iconoSVG(code, isDay);
    document.getElementById('clima-temp').textContent = Math.round(d.current.temperature_2m) + '°';
    document.getElementById('clima-desc').textContent = CONFIG.CIUDAD;
    document.getElementById('clima-hum').textContent = 'Humedad ' + Math.round(d.current.relative_humidity_2m) + '%';
    document.getElementById('clima-viento').textContent = 'Viento ' + Math.round(d.current.wind_speed_10m) + ' km/h';
    document.getElementById('clima-minmax').innerHTML =
      'Hoy: <b>' + Math.round(d.daily.temperature_2m_max[0]) + '°</b> / ' + Math.round(d.daily.temperature_2m_min[0]) + '°';

    aplicarTema(code, isDay);
    renderPronostico(d.daily);
  }catch(e){
    console.error(e);
    err.style.display = 'block';
  }
}

function renderPronostico(daily){
  const cont = document.getElementById('pronostico');
  cont.innerHTML = '';
  daily.time.slice(0,5).forEach((fechaStr, i) => {
    const fecha = new Date(fechaStr + 'T12:00:00');
    const nombre = i===0 ? 'Hoy' : fecha.toLocaleDateString('es-AR',{weekday:'short'}).replace('.','');
    const code = daily.weather_code[i];
    const div = document.createElement('div');
    div.className = 'dia-forecast';
    div.innerHTML = `<span class="df-nombre">${nombre}</span>
      <span class="df-icono">${iconoSVG(code, true, 'mini')}</span>
      <span class="df-max">${Math.round(daily.temperature_2m_max[i])}°</span>
      <span class="df-min">${Math.round(daily.temperature_2m_min[i])}°</span>`;
    cont.appendChild(div);
  });
}

/* ============== CALENDARIO (vía /api/calendar, sin clave en el navegador) ============== */
async function cargarCalendario(){
  const lista = document.getElementById('eventos');
  const vacio = document.getElementById('cal-vacio');
  const err = document.getElementById('cal-error');
  lista.innerHTML = ''; vacio.style.display='none'; err.style.display='none';

  try{
    const r = await fetch('/api/calendar');
    if(!r.ok) throw new Error('http ' + r.status);
    const d = await r.json();

    if(d.noConfigurado){ err.style.display='block'; return; }

    const items = d.items || [];
    if(items.length === 0){ vacio.style.display='block'; return; }

    items.forEach(ev => {
      const li = document.createElement('li');
      li.className = 'evento';
      const start = ev.start.dateTime || ev.start.date;
      const fecha = new Date(start);
      const esTodoElDia = !ev.start.dateTime;
      const cuando = esTodoElDia
        ? fecha.toLocaleDateString('es-AR', {day:'2-digit', month:'short'})
        : fecha.toLocaleDateString('es-AR', {day:'2-digit', month:'short'}) + '\n' +
          fecha.toLocaleTimeString('es-AR', {hour:'2-digit', minute:'2-digit'});

      li.innerHTML = `<span class="cuando">${cuando.replace('\n','<br>')}</span>
        <span class="titulo">${(ev.summary || '(sin título)')}${ev.location ? '<span class="lugar">'+ev.location+'</span>' : ''}</span>`;
      lista.appendChild(li);
    });
  }catch(e){
    console.error(e);
    err.style.display = 'block';
  }
}

cargarClima(); cargarCalendario();
setInterval(cargarClima, CONFIG.REFRESCO_MS);
setInterval(cargarCalendario, CONFIG.REFRESCO_MS);

/* ============== BOTÓN DE VOZ → GRABAR AUDIO → GEMINI ==============
   No usamos SpeechRecognition porque depende de un servicio en la nube
   de Google atado a Play Services (no disponible en este LineageOS sin GApps).
   En cambio: grabamos el audio con MediaRecorder (estándar del navegador,
   no depende de Google) y se lo mandamos directo a Gemini, que transcribe
   y responde en un solo paso. */
const micBtn = document.getElementById('mic-btn');
const micHint = document.getElementById('mic-hint');
const answerBox = document.getElementById('answer');

let mediaRecorder = null;
let audioChunks = [];
let grabando = false;

function cerrarRespuesta(){ answerBox.classList.remove('show'); }

async function activarConsulta(){
  if(micBtn.classList.contains('thinking')) return;

  if(!grabando){
    // --- Empezar a grabar ---
    if(!navigator.mediaDevices || !window.MediaRecorder){
      mostrarRespuesta('', 'Este navegador no puede grabar audio (falta MediaRecorder).', '⚠️');
      return;
    }
    try{
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      mediaRecorder = new MediaRecorder(stream);
      audioChunks = [];
      mediaRecorder.ondataavailable = (e) => { if(e.data.size > 0) audioChunks.push(e.data); };
      mediaRecorder.onstop = async () => {
        stream.getTracks().forEach(t => t.stop()); // apaga el micrófono
        const blobOriginal = new Blob(audioChunks, { type: mediaRecorder.mimeType || 'audio/webm' });
        try{
          // Gemini no acepta audio/webm (lo que graba Chrome por defecto).
          // Lo convertimos a WAV en el propio navegador antes de mandarlo.
          const wavBlob = await convertirAWav(blobOriginal);
          enviarAudioAGemini(wavBlob);
        }catch(e){
          console.error('Error convirtiendo el audio:', e);
          mostrarRespuesta('', 'No se pudo procesar el audio grabado.', '⚠️');
          micBtn.classList.remove('thinking');
          micHint.textContent = 'Tocá para preguntar';
        }
      };
      mediaRecorder.start();
      grabando = true;
      micBtn.classList.add('listening');
      micHint.textContent = 'Grabando… tocá de nuevo para enviar';
      cerrarRespuesta();
    }catch(e){
      console.error(e);
      mostrarRespuesta('', 'No se pudo acceder al micrófono. Revisá los permisos de la app.', '⚠️');
    }
  } else {
    // --- Parar de grabar y enviar ---
    grabando = false;
    micBtn.classList.remove('listening');
    micBtn.classList.add('thinking');
    micHint.textContent = 'Pensando…';
    mediaRecorder.stop();
  }
}

function blobABase64(blob){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onloadend = () => resolve(reader.result.split(',')[1]); // saca el prefijo data:...;base64,
    reader.onerror = reject;
    reader.readAsDataURL(blob);
  });
}

/* --- Conversión de audio grabado (webm) a WAV, que sí acepta Gemini --- */
async function convertirAWav(blob){
  const arrayBuffer = await blob.arrayBuffer();
  const AudioCtx = window.AudioContext || window.webkitAudioContext;
  const audioCtx = new AudioCtx();
  const audioBuffer = await audioCtx.decodeAudioData(arrayBuffer);
  const wavBlob = audioBufferAWav(audioBuffer);
  audioCtx.close();
  return wavBlob;
}

function audioBufferAWav(buffer){
  const numChannels = buffer.numberOfChannels;
  const sampleRate = buffer.sampleRate;
  const bitDepth = 16;

  const canal0 = buffer.getChannelData(0);
  const interleaved = numChannels === 2 ? intercalarCanales(canal0, buffer.getChannelData(1)) : canal0;

  const dataLength = interleaved.length * (bitDepth / 8);
  const arrBuf = new ArrayBuffer(44 + dataLength);
  const view = new DataView(arrBuf);

  escribirTexto(view, 0, 'RIFF');
  view.setUint32(4, 36 + dataLength, true);
  escribirTexto(view, 8, 'WAVE');
  escribirTexto(view, 12, 'fmt ');
  view.setUint32(16, 16, true);
  view.setUint16(20, 1, true); // PCM
  view.setUint16(22, numChannels, true);
  view.setUint32(24, sampleRate, true);
  view.setUint32(28, sampleRate * numChannels * (bitDepth / 8), true);
  view.setUint16(32, numChannels * (bitDepth / 8), true);
  view.setUint16(34, bitDepth, true);
  escribirTexto(view, 36, 'data');
  view.setUint32(40, dataLength, true);

  let offset = 44;
  for (let i = 0; i < interleaved.length; i++, offset += 2){
    const s = Math.max(-1, Math.min(1, interleaved[i]));
    view.setInt16(offset, s < 0 ? s * 0x8000 : s * 0x7FFF, true);
  }

  return new Blob([view], { type: 'audio/wav' });
}

function intercalarCanales(izq, der){
  const resultado = new Float32Array(izq.length + der.length);
  let i = 0, j = 0;
  while (i < resultado.length){
    resultado[i++] = izq[j];
    resultado[i++] = der[j];
    j++;
  }
  return resultado;
}

function escribirTexto(view, offset, texto){
  for (let i = 0; i < texto.length; i++) view.setUint8(offset + i, texto.charCodeAt(i));
}

async function enviarAudioAGemini(blob){
  try{
    const base64Audio = await blobABase64(blob);

    const r = await fetch('/api/gemini', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ mime_type: blob.type || 'audio/webm', data: base64Audio })
    });
    if(!r.ok) throw new Error('http ' + r.status);
    const d = await r.json();
    if(d.error) throw new Error(d.error);

    const pregunta = d.pregunta || '';
    const texto = d.respuesta || 'No recibí respuesta.';

    mostrarRespuesta(pregunta, texto, iconoParaPregunta(pregunta || texto));
    hablar(texto);
  }catch(e){
    console.error(e);
    mostrarRespuesta('', 'Hubo un error consultando a la IA. Revisá la conexión.', '⚠️');
  }finally{
    micBtn.classList.remove('thinking');
    micHint.textContent = 'Tocá para preguntar';
  }
}

function iconoParaPregunta(p){
  const t = p.toLowerCase();
  if(/clima|temperatura|lluv|frío|calor|viento/.test(t)) return WMO_EMOJI[ultimoCodigoClima] || '🌡️';
  if(/calendario|reunión|evento|agenda|turno/.test(t)) return '🗓️';
  if(/hora|tiempo(?!\s+de\s+lluvia)/.test(t)) return '🕐';
  return '✨';
}

function mostrarRespuesta(pregunta, texto, icono){
  document.getElementById('answer-q').textContent = pregunta ? '"' + pregunta + '"' : '';
  document.getElementById('answer-icon').textContent = icono || '✨';
  document.getElementById('answer-text').textContent = texto;
  answerBox.classList.add('show');
  clearTimeout(window._answerTimeout);
  window._answerTimeout = setTimeout(cerrarRespuesta, 30000);
}

function hablar(texto){
  if(!('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(texto);
  u.lang = CONFIG.VOZ_LANG;
  window.speechSynthesis.speak(u);
}
